name: CI/CD Docker ALTN71 2026

# Lancement manuel ou à chaque push sur main
on:
  workflow_dispatch:
  push:
    branches:
      - main

# Compte Docker Hub utilisé dans docker-compose.yml
env:
  DOCKER_ACCOUNT: ${{ secrets.DOCKER_ACCOUNT }}

jobs:

  # Compile la solution et lance les tests
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      - name: Tests
        run: dotnet test --no-build

  # Construit et publie les images si les tests passent
  docker:
    runs-on: ubuntu-latest
    needs: tests
    environment: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Login Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      # Construit toutes les images du docker-compose.yml
      - name: Build images
        env:
          DOCKER_ACCOUNT: ${{ secrets.DOCKER_ACCOUNT }}
        run: docker compose build

      # Envoie les images sur Docker Hub
      - name: Push images
        env:
          DOCKER_ACCOUNT: ${{ secrets.DOCKER_ACCOUNT }}
        run: docker compose push
